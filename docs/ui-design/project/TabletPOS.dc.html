<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet captain POS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.rb{width:56px;height:56px;border-radius:12px;border:0;background:none;color:#A1A1AA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:10px;cursor:pointer}
.rb.on{background:#27272A;color:#FAFAFA}
.ch{height:44px;padding:0 16px;border-radius:999px;border:1px solid #3F3F46;background:#18181B;color:#D4D4D8;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.ch.on{background:#FAFAFA;color:#09090B;border-color:#FAFAFA;font-weight:600}
.it{background:#18181B;border:1px solid #3F3F46;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:96px;text-align:left;color:#FAFAFA;font:inherit;cursor:pointer}
.it b{font-size:15px}
.it span{font-size:12px;color:#A1A1AA}
.ln{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #27272A;font-size:14px}
.btn{height:52px;border-radius:10px;border:1px solid #3F3F46;background:#27272A;color:#FAFAFA;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn.p{background:#D4D4D8;border-color:#D4D4D8;color:#09090B}
</style>
</helmet>
<div style="width:1024px;height:768px;box-sizing:border-box;background:#09090B;color:#FAFAFA;display:flex">
<nav style="width:72px;background:#18181B;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;box-sizing:border-box" aria-label="Main">
<button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Tables</button>
<button class="rb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path></svg>Order</button>
<button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3h8l-1 7a3 3 0 01-6 0zM12 13v8M8 21h8"></path></svg>Tabs</button>
<button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3 3-5 6-5s6 2 6 5"></path></svg>Queue</button>
<span style="margin-top:auto;width:40px;height:40px;border-radius:999px;background:#27272A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600" aria-label="Arun, Captain">AK</span>
</nav>
<section style="flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px" aria-label="Menu">
<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:20px;font-weight:700">Table R4 · Seat 2</div><div style="font-size:13px;color:#A1A1AA">4 covers · Rooftop</div></div><span style="background:#FBBF24;color:#09090B;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700">Happy hour · 14 min</span></div>
<div style="display:flex;gap:8px;overflow:hidden"><button class="ch">Favourites</button><button class="ch on">Spirits</button><button class="ch">Beer</button><button class="ch">Cocktails</button><button class="ch">Bites</button><button class="ch">Mains</button></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<button class="it"><b>House Whisky</b><span>30 ml ₹180 · 60 ml ₹340</span></button>
<button class="it" style="border:2px solid #FAFAFA"><b>Single Malt 12Y</b><span>60 ml ₹400 happy hour</span></button>
<button class="it"><b>Premium Vodka</b><span>30 ml ₹220</span></button>
<button class="it"><b>Dark Rum</b><span>30 ml ₹160</span></button>
<button class="it"><b>London Dry Gin</b><span>30 ml ₹240</span></button>
<button class="it" style="opacity:.5" disabled><b>Aged Cognac</b><span>Out of stock</span></button>
<button class="it"><b>Blanco Tequila</b><span>Shot ₹260</span></button>
<button class="it"><b>Bottle service</b><span>750 ml ₹5,400</span></button>
<button class="it"><b>Irish Whiskey</b><span>30 ml ₹260</span></button>
</div>
</section>
<aside style="width:320px;background:#18181B;border-left:1px solid #27272A;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px" aria-label="Order">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Order A-1043</b><span style="font-size:12px;color:#A1A1AA">3 sent · 1 new</span></div>
<div style="flex:1">
<div class="ln"><span>Premium Lager × 2</span><span>₹600</span></div>
<div class="ln"><span>Chicken Wings</span><span>₹350</span></div>
<div class="ln"><span>Classic Mojito</span><span>₹245</span></div>
<div class="ln" style="color:#FDE68A"><span>Single Malt 12Y 60 ml · new<br><span style="font-size:12px;color:#A1A1AA">On the rocks · Seat 2</span></span><span>₹400</span></div>
</div>
<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:6px 0"><span>Total</span><span>₹1,894</span></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn">More actions</button><button class="btn">Print bill</button></div>
<button class="btn p">Send to bar</button>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

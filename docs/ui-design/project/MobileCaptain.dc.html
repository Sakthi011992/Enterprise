<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Android captain order taking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,Roboto,system-ui,sans-serif}
.ch{height:32px;padding:0 14px;border-radius:8px;border:1px solid #A1A1AA;background:#fff;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.ch.on{background:#E4E4E7;border-color:#E4E4E7;font-weight:600}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #E4E4E7}
.add{width:44px;height:44px;border-radius:12px;border:1px solid #A1A1AA;background:#fff;font-size:22px;cursor:pointer;color:#18181B}
.nv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#3F3F46;background:none;border:0;font-family:inherit;cursor:pointer;flex:1}
.nv i{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nv.on{font-weight:600;color:#18181B}.nv.on i{background:#E4E4E7}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAFAFA;color:#18181B;display:flex;flex-direction:column;position:relative">
<header style="display:flex;align-items:center;gap:8px;padding:36px 8px 8px;background:#FAFAFA">
<button aria-label="Back" style="width:48px;height:48px;border:0;background:none;cursor:pointer;color:#18181B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="flex:1"><div style="font-size:20px;font-weight:600">Table R4</div><div style="font-size:13px;color:#52525B">4 covers · Rooftop · Seat 2</div></div>
<button aria-label="More options" style="width:48px;height:48px;border:0;background:none;cursor:pointer;color:#18181B"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
</header>
<div style="padding:0 16px 10px"><label for="cap-s" style="position:absolute;left:-9999px">Search menu</label><input id="cap-s" placeholder="Search menu" style="width:100%;box-sizing:border-box;height:48px;border-radius:999px;border:0;background:#E4E4E7;padding:0 20px;font:inherit;font-size:15px;color:#18181B"></div>
<div style="display:flex;gap:8px;padding:0 16px 10px;overflow:hidden"><button class="ch">Favourites</button><button class="ch on">Beer</button><button class="ch">Spirits</button><button class="ch">Cocktails</button><button class="ch">Bites</button></div>
<div style="flex:1;overflow:hidden;background:#fff">
<div class="it"><div><div style="font-size:16px;font-weight:600">Premium Lager 650ml</div><div style="font-size:13px;color:#52525B">₹300 · bucket of 5 ₹1,350</div></div><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700">2</span><button class="add" aria-label="Add Premium Lager">+</button></div></div>
<div class="it"><div><div style="font-size:16px;font-weight:600">Draught Wheat Beer</div><div style="font-size:13px;color:#52525B">Pint ₹320 · Pitcher ₹1,100</div></div><button class="add" aria-label="Add Draught Wheat Beer">+</button></div>
<div class="it"><div><div style="font-size:16px;font-weight:600">Beer Tower 3L</div><div style="font-size:13px;color:#52525B">₹1,400 · happy hour</div></div><button class="add" aria-label="Add Beer Tower">+</button></div>
<div class="it"><div><div style="font-size:16px;font-weight:600;color:#71717A">Craft IPA 330ml</div><div style="font-size:13px;color:#7F1D1D;font-weight:500">Out of stock · marked by bar</div></div><button class="add" disabled aria-label="Craft IPA unavailable" style="opacity:.4">+</button></div>
<div class="it"><div><div style="font-size:16px;font-weight:600">Stout 500ml</div><div style="font-size:13px;color:#52525B">₹340</div></div><button class="add" aria-label="Add Stout">+</button></div>
</div>
<div role="status" style="position:absolute;left:16px;right:16px;bottom:168px;background:#27272A;color:#FAFAFA;border-radius:8px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)"><span>BOT 2291 sent to the bar</span><button style="border:0;background:none;color:#D4D4D8;font:inherit;font-weight:600;cursor:pointer">Undo</button></div>
<div style="padding:12px 16px;background:#fff;border-top:1px solid #E4E4E7;display:flex;gap:10px;align-items:center">
<div style="flex:1"><div style="font-size:13px;color:#52525B">3 new items</div><div style="font-size:18px;font-weight:700">₹1,195</div></div>
<button style="height:48px;padding:0 18px;border-radius:999px;border:1px solid #A1A1AA;background:#fff;font:inherit;font-weight:600;cursor:pointer">View order</button>
<button style="height:48px;padding:0 18px;border-radius:999px;border:0;background:#3F3F46;color:#fff;font:inherit;font-weight:600;cursor:pointer">Send KOT</button>
</div>
<nav style="display:flex;padding:10px 0 20px;background:#F4F4F5" aria-label="Main">
<button class="nv"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></i>Tables</button>
<button class="nv on"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path></svg></i>Order</button>
<button class="nv"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3h8l-1 7a3 3 0 01-6 0zM12 13v8M8 21h8"></path></svg></i>Tabs</button>
<button class="nv"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3 3-5 6-5s6 2 6 5"></path></svg></i>Queue</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>

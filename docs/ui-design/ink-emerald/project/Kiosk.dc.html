<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Self-order kiosk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>body{margin:0;background:#F5F6F8}a{color:#0E7C66}a:hover{color:#0A5F4E}</style>
</helmet>
<div style="width: 768px; height: 1024px; box-sizing: border-box; background: #F5F6F8; color: #101828; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 28px; background: #FFFFFF; border-bottom: 1px solid #E4E7EC">
    <div style="display: flex; gap: 14px; align-items: center">
      <span style="width: 52px; height: 52px; border-radius: 12px; background: #0B1220; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif; font-weight: 800; font-size: 16px">YV</span>
      <div>
        <h1 style="margin: 0; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #0B1220">Order here</h1>
        <div style="font-size: 14px; color: #475467">Pick up at the counter · takeaway or eat in</div>
      </div>
    </div>
    <button type="button" style="height: 52px; padding: 0 18px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">English ▾</button>
  </header>

  <div role="group" aria-label="Categories" style="padding: 20px 28px; display: flex; padding-bottom: 20px">
    <div style="flex: 1; display: flex; padding: 4px; background: #EAECF0; border-radius: 16px; gap: 4px">
      <button type="button" aria-pressed="false" style="flex: 1; height: 64px; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 16px; font-weight: 500; color: #475467; cursor: pointer">Popular</button>
      <button type="button" aria-pressed="true" style="flex: 1; height: 64px; border: 0; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; color: #0B1220; box-shadow: 0 1px 2px rgba(16,24,40,.08), inset 0 -3px 0 #0E7C66; cursor: pointer">Bites</button>
      <button type="button" aria-pressed="false" style="flex: 1; height: 64px; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 16px; font-weight: 500; color: #475467; cursor: pointer">Mocktails</button>
      <button type="button" aria-pressed="false" style="flex: 1; height: 64px; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 16px; font-weight: 500; color: #475467; cursor: pointer">Drinks 21+</button>
    </div>
  </div>

  <div style="padding: 0 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex: 1; align-content: start">
    <button type="button" style="min-height: 232px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #101828; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.04)">
      <span style="height: 120px; border-radius: 10px; background: #F2F4F7; border: 1px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; color: #667085; font-size: 13px">Photo</span>
      <b style="font-size: 16px; font-weight: 600">Chicken Wings</b>
      <span style="font-size: 14px; color: #475467; font-variant-numeric: tabular-nums">8 pc · ₹350</span>
    </button>
    <button type="button" aria-pressed="true" style="min-height: 232px; background: #F3FAF8; border: 1px solid #0E7C66; box-shadow: 0 0 0 1px #0E7C66; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #101828; cursor: pointer">
      <span style="height: 120px; border-radius: 10px; background: #E7F4F0; border: 1px dashed #A6E3D3; display: flex; align-items: center; justify-content: center; color: #0A5F4E; font-size: 13px">Photo</span>
      <b style="font-size: 16px; font-weight: 600">Loaded Nachos</b>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475467; font-variant-numeric: tabular-nums">Veg · ₹320<span style="font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #E7F4F0; color: #0A5F4E">In cart</span></span>
    </button>
    <button type="button" style="min-height: 232px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #101828; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.04)">
      <span style="height: 120px; border-radius: 10px; background: #F2F4F7; border: 1px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; color: #667085; font-size: 13px">Photo</span>
      <b style="font-size: 16px; font-weight: 600">Fish &amp; Chips</b>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #FFFAEB; color: #B54708">Only 3 left</span>
    </button>
    <button type="button" disabled style="min-height: 232px; background: #F9FAFB; border: 1px solid #E4E7EC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #667085">
      <span style="height: 120px; border-radius: 10px; background: #F2F4F7; border: 1px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; color: #667085; font-size: 13px; opacity: .7">Photo</span>
      <b style="font-size: 16px; font-weight: 600; color: #667085">Paneer Tikka</b>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #FEF3F2; color: #B42318">Sold out</span>
    </button>
    <button type="button" style="min-height: 232px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #101828; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.04)">
      <span style="height: 120px; border-radius: 10px; background: #F2F4F7; border: 1px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; color: #667085; font-size: 13px">Photo</span>
      <b style="font-size: 16px; font-weight: 600">Peri Peri Fries</b>
      <span style="font-size: 14px; color: #475467; font-variant-numeric: tabular-nums">Veg · ₹180</span>
    </button>
    <button type="button" style="min-height: 232px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: #101828; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.04)">
      <span style="height: 120px; border-radius: 10px; background: #F2F4F7; border: 1px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; color: #667085; font-size: 13px">Photo</span>
      <b style="font-size: 16px; font-weight: 600">Beer Tower 3L</b>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #FBF3E4; color: #8A5A12">21+ · ID at pickup</span>
    </button>
  </div>

  <div role="note" style="margin: 20px 28px 0; background: #FBF3E4; color: #8A5A12; border-radius: 12px; padding: 14px 16px; font-size: 14px; display: flex; align-items: center; gap: 10px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>
    Drinks with alcohol need an ID check at pickup. Staff will confirm before pouring.
  </div>

  <footer style="margin-top: 20px; padding: 20px 28px 28px; background: #0B1220; color: #F2F4F7; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <div>
      <div style="font-family: Manrope, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">2 items · ₹670</div>
      <div style="font-size: 14px; color: #A3ADC2">Pay by UPI here or with cash at the counter</div>
    </div>
    <button type="button" style="height: 64px; padding: 0 32px; border-radius: 14px; border: 0; background: #2FB896; color: #04231C; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">Review &amp; pay</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

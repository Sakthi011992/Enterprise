<div style="display: flex; flex-wrap: wrap; min-height: 960px; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #101828; font-size: 14px; line-height: 1.45">

      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">

            <button type="button" style="min-height: 112px; padding: 14px; border-radius: 16px; border: 1px solid #0E7C66; background: #F3FAF8; box-shadow: 0 0 0 2px #0E7C66; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; text-align: center; cursor: pointer"><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #0B1220">R4</span><span style="font-size: 12px; color: #475467; font-variant-numeric: tabular-nums">4 seats · 4 guests<br>₹2,034 · 2 h 30 m</span></button>

            <button type="button" style="min-height: 112px; padding: 14px; border-radius: 999px; border: 1px solid #D0D5DD; background: #F2F4F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; text-align: center; cursor: pointer"><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #344054">R6</span><span style="font-size: 12px; color: #475467; font-variant-numeric: tabular-nums">2 seats · Cleaning</span></button>
            <button type="button" style="grid-column: span 2; min-height: 112px; padding: 14px; border-radius: 16px; border: 1px solid #B2DDFF; background: #EFF8FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; text-align: center; cursor: pointer"><span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #175CD3">R7 + R8 (merged)</span><span style="font-size: 12px; color: #475467; font-variant-numeric: tabular-nums">12 seats · birthday party · ₹8,400</span></button>

            <div style="display: flex; flex-direction: column; gap: 6px"><label for="t-price" style="font-size: 13px; font-weight: 500; color: #344054">Price list</label><select id="t-price" style="height: 40px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; color: #101828; box-sizing: border-box; width: 100%"><option>Rooftop (+10%)</option><option>Standard</option></select></div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Open in POS</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Transfer guests</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">QR code</button></div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #F2F4F7"><button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #B42318; cursor: pointer; white-space: nowrap">Delete table</button><div style="margin-left: auto; display: flex; gap: 8px"><button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-weight: 500; color: #344054; cursor: pointer">Cancel</button><button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-weight: 500; color: #344054; cursor: pointer">Save</button></div></div>

            <div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; color: #0B1220">Sections</h2><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap; margin-left: auto">New section</button></div>
            <div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #F2F4F7"><span>Indoor · 12 tables</span><span style="margin-left: auto; display: flex; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Edit</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #B42318; cursor: pointer; white-space: nowrap">Delete</button></span></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #F2F4F7"><span>Rooftop · 8 tables · smoking</span><span style="margin-left: auto; display: flex; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Edit</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #B42318; cursor: pointer; white-space: nowrap">Delete</button></span></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #F2F4F7"><span>Bar counter · 10 seats</span><span style="margin-left: auto; display: flex; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Edit</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #B42318; cursor: pointer; white-space: nowrap">Delete</button></span></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #F2F4F7"><span>VIP lounge · 4 tables</span><span style="margin-left: auto; display: flex; gap: 8px"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #344054; cursor: pointer; white-space: nowrap">Edit</button><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #B42318; cursor: pointer; white-space: nowrap">Delete</button></span></div></div>
          </section>
        </aside>
      </div>
    </main>
  </div>
</div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff PIN login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>body{margin:0;background:#FFFFFF}a{color:#0E7C66}a:hover{color:#0A5F4E}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #101828; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; padding: 32px 24px 28px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 34px; height: 34px; border-radius: 10px; background: #0B1220; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif; font-weight: 800; font-size: 13px">YV</div>
    <span style="font-size: 14px; color: #475467">Main outlet</span>
    <button type="button" style="margin-left: auto; min-width: 64px; height: 44px; border: 0; background: none; font: inherit; font-weight: 600; color: #0E7C66; cursor: pointer">Switch</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #0B1220">Sign in</h1>
    <span style="font-size: 14px; color: #475467">Tap your name, then enter your PIN</span>
  </div>

  <div role="group" aria-label="Staff" style="display: flex; justify-content: space-between">
    <button type="button" style="min-width: 64px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: #475467; cursor: pointer"><span style="width: 52px; height: 52px; border-radius: 999px; background: #F2F4F7; color: #344054; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">AK</span>Arun</button>
    <button type="button" aria-pressed="true" style="min-width: 64px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600; color: #0B1220; cursor: pointer"><span style="width: 52px; height: 52px; border-radius: 999px; background: #E7F4F0; color: #0A5F4E; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #0E7C66">MN</span>Meera</button>
    <button type="button" style="min-width: 64px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: #475467; cursor: pointer"><span style="width: 52px; height: 52px; border-radius: 999px; background: #F2F4F7; color: #344054; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">RS</span>Ravi</button>
    <button type="button" style="min-width: 64px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: #475467; cursor: pointer"><span style="width: 52px; height: 52px; border-radius: 999px; background: #F2F4F7; color: #344054; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">PR</span>Priya</button>
    <button type="button" style="min-width: 64px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: #475467; cursor: pointer"><span style="width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; border: 1px dashed #D0D5DD; box-sizing: border-box; color: #475467; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 20px">+</span>Other</button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 4px">
    <div role="img" aria-label="4 digits entered, PIN incorrect" style="display: flex; gap: 16px">
      <span style="width: 14px; height: 14px; border-radius: 999px; background: #D92D20"></span>
      <span style="width: 14px; height: 14px; border-radius: 999px; background: #D92D20"></span>
      <span style="width: 14px; height: 14px; border-radius: 999px; background: #D92D20"></span>
      <span style="width: 14px; height: 14px; border-radius: 999px; background: #D92D20"></span>
    </div>
    <div role="alert" style="display: flex; align-items: center; gap: 8px; background: #FEF3F2; border: 1px solid #FECDCA; color: #B42318; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6M12 17h.01"></path></svg>
      Wrong PIN. 2 tries left before lock.
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: auto">
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">1</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">2</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">3</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">4</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">5</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">6</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">7</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">8</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">9</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #0E7C66; cursor: pointer">Face ID</button>
    <button type="button" style="height: 60px; border-radius: 16px; border: 1px solid #E4E7EC; background: #F9FAFB; font-family: Manrope, sans-serif; font-size: 28px; font-weight: 600; color: #0B1220; cursor: pointer">0</button>
    <button type="button" aria-label="Delete digit" style="height: 60px; border-radius: 16px; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 500; color: #475467; cursor: pointer">Delete</button>
  </div>

  <button type="button" style="height: 44px; border: 0; background: none; font: inherit; font-weight: 500; color: #0E7C66; text-decoration: underline; cursor: pointer">Use password instead</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>

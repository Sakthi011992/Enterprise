<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 32px; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #101828; box-sizing: border-box; width: 100%">
  <nav aria-label="Breadcrumb" style="display: flex; gap: 8px; font-size: 13px; color: #667085">
    <span>{{ trail }}</span><span aria-hidden="true">/</span><span style="color: #101828; font-weight: 500">{{ page }}</span>
  </nav>
  <label style="flex: 1 1 260px; max-width: 420px; margin-left: 24px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid #E4E7EC; border-radius: 10px; background: #F9FAFB; color: #667085">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" placeholder="Search or jump to…" aria-label="Search" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: #101828; outline: none">
    <span style="font-size: 12px; border: 1px solid #E4E7EC; border-radius: 6px; padding: 1px 6px; background: #FFFFFF">Ctrl K</span>
  </label>
  <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #E4E7EC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #101828; cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 999px; background: #12B76A"></span>Main outlet</button>
    <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 40px; height: 40px; border: 1px solid #E4E7EC; border-radius: 10px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
      <span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 999px; background: #D92D20; border: 2px solid #FFFFFF"></span>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"trail":{"editor":"text","default":"Sales"},"page":{"editor":"text","default":"Orders & invoices"},"$preview":{"width":1180,"height":69}}'>
class Component extends DCLogic {
  renderVals() {
    return { trail: this.props.trail ?? 'Sales', page: this.props.page ?? 'Orders & invoices' };
  }
}
</script>
</body>
</html>
